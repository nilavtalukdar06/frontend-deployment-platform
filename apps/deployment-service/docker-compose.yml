services:
  deployment-service:
    build:
      context: ../..
      dockerfile: apps/deployment-service/Dockerfile
    image: deployment-service
    container_name: deployment-service
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      USER_ID: ${USER_ID:-}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
