services:
  deployment-service:
    build:
      context: ../..
      dockerfile: apps/deployment-service/Dockerfile
    image: deployment-service
    container_name: deployment-service
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      USER_ID: ${USER_ID:-}
      GITHUB_TOKEN_ENCRYPTED: ${GITHUB_TOKEN_ENCRYPTED:-}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
