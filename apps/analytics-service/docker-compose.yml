services:
  analytics-service:
    build:
      context: ../..
      dockerfile: apps/analytics-service/Dockerfile
    image: analytics-service
    container_name: analytics-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4004
    ports:
      - "${ANALYTICS_SERVICE_PORT:-4004}:4004"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
