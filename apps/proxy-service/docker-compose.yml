services:
  proxy-service:
    build:
      context: ../..
      dockerfile: apps/proxy-service/Dockerfile
    container_name: proxy-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
    ports:
      - "${PROXY_SERVICE_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - proxy-service-network

networks:
  proxy-service-network:
    driver: bridge
