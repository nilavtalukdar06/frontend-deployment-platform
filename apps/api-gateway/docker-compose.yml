services:
  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:4000}
      PROJECT_SERVICE_URL: ${PROJECT_SERVICE_URL:-http://host.docker.internal:4001}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - api-gateway-network

networks:
  api-gateway-network:
    driver: bridge
