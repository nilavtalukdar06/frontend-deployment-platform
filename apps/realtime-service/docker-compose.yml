services:
  realtime-service:
    build:
      context: ../..
      dockerfile: apps/realtime-service/Dockerfile
    image: realtime-service
    container_name: realtime-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4003
    ports:
      - "${REALTIME_SERVICE_PORT:-4003}:4003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
