services:
  logs-service:
    build:
      context: ../..
      dockerfile: apps/logs-service/Dockerfile
    image: logs-service
    container_name: logs-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4005
    ports:
      - "${LOGS_SERVICE_PORT:-4005}:4005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
